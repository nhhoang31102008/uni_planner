<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Study Planner - Quản lý Học tập Thông minh</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Custom scrollbar for modern sleek look */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
    <div id="root" class="h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DUMMY INITIAL DATA ---
        const INITIAL_COURSES = [
            { id: 'c1', name: 'Lập trình Web nâng cao', code: 'IT301', credits: 3, instructor: 'TS. Nguyễn Văn A', room: 'P.402 - A1', color: 'blue' },
            { id: 'c2', name: 'Cấu trúc Dữ liệu & Giải thuật', code: 'IT202', credits: 4, instructor: 'ThS. Trần Thị B', room: 'P.301 - B2', color: 'indigo' },
            { id: 'c3', name: 'Cơ sở Dữ liệu phân tán', code: 'IT305', credits: 3, instructor: 'PGS.TS. Lê Văn C', room: 'P.502 - A3', color: 'emerald' },
            { id: 'c4', name: 'Tiếng Anh chuyên ngành', code: 'FL201', credits: 2, instructor: 'Cô Sarah Jenkins', room: 'P.204 - C1', color: 'amber' }
        ];

        const INITIAL_TASKS = [
            { id: 't1', title: 'Hoàn thành bài tập lớn ReactJS', courseId: 'c1', priority: 'High', status: 'In Progress', dueDate: '2026-04-20' },
            { id: 't2', title: 'Ôn tập chương Cây nhị phân tìm kiếm', courseId: 'c2', priority: 'Medium', status: 'To-Do', dueDate: '2026-04-18' },
            { id: 't3', title: 'Nộp báo cáo đồ án cơ sở dữ liệu', courseId: 'c3', priority: 'High', status: 'Done', dueDate: '2026-04-15' },
            { id: 't4', title: 'Làm bài tập Reading Unit 5', courseId: 'c4', priority: 'Low', status: 'To-Do', dueDate: '2026-04-22' }
        ];

        const INITIAL_SCHEDULE = [
            { id: 's1', courseId: 'c1', day: 'Thứ Hai', time: '07:30 - 10:45' },
            { id: 's2', courseId: 'c2', day: 'Thứ Ba', time: '13:30 - 16:45' },
            { id: 's3', courseId: 'c3', day: 'Thứ Tư', time: '09:00 - 11:30' },
            { id: 's4', courseId: 'c4', day: 'Thứ Sáu', time: '13:30 - 15:00' }
        ];

        const INITIAL_NOTES = "Nhớ đọc lại tài liệu Middleware trong ExpressJS trước buổi học tới.\nHạn nộp học bổng khuyến khích học tập trước 30/04.\nNhóm họp đồ án vào tối thứ Bảy lúc 20:00 qua Google Meet.";

        const INITIAL_GRADES = [
            { id: 'g1', courseName: 'Lập trình Web nâng cao', credits: 3, score10: 8.5 },
            { id: 'g2', courseName: 'Cấu trúc Dữ liệu & Giải thuật', credits: 4, score10: 7.8 },
            { id: 'g3', courseName: 'Cơ sở Dữ liệu phân tán', credits: 3, score10: 9.0 },
            { id: 'g4', courseName: 'Tiếng Anh chuyên ngành', credits: 2, score10: 8.0 }
        ];

        function App() {
            // State persistence with localStorage
            const [activeTab, setActiveTab] = useState('dashboard');
            const [darkMode, setDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');
            const [courses, setCourses] = useState(() => JSON.parse(localStorage.getItem('planner_courses')) || INITIAL_COURSES);
            const [tasks, setTasks] = useState(() => JSON.parse(localStorage.getItem('planner_tasks')) || INITIAL_TASKS);
            const [schedule, setSchedule] = useState(() => JSON.parse(localStorage.getItem('planner_schedule')) || INITIAL_SCHEDULE);
            const [notes, setNotes] = useState(() => localStorage.getItem('planner_notes') || INITIAL_NOTES);
            const [grades, setGrades] = useState(() => JSON.parse(localStorage.getItem('planner_grades')) || INITIAL_GRADES);
            const [studyHours, setStudyHours] = useState(() => JSON.parse(localStorage.getItem('planner_study_hours')) || 14.5);

            // Toast Notification state
            const [toast, setToast] = useState(null);

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            }, [darkMode]);

            useEffect(() => {
                localStorage.setItem('planner_courses', JSON.stringify(courses));
                localStorage.setItem('planner_tasks', JSON.stringify(tasks));
                localStorage.setItem('planner_schedule', JSON.stringify(schedule));
                localStorage.setItem('planner_notes', notes);
                localStorage.setItem('planner_grades', JSON.stringify(grades));
                localStorage.setItem('planner_study_hours', JSON.stringify(studyHours));
            }, [courses, tasks, schedule, notes, grades, studyHours]);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3000);
            };

            return (
                <div className="flex h-full overflow-hidden">
                    {/* Sidebar */}
                    <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} darkMode={darkMode} setDarkMode={setDarkMode} />

                    {/* Main Content Area */}
                    <div className="flex-1 flex flex-col min-w-0 overflow-hidden">
                        {/* Top Navbar */}
                        <header className="h-16 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-6 flex items-center justify-between shrink-0 z-10">
                            <div className="flex items-center gap-3">
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400 capitalize">Học kỳ hiện tại: <strong className="text-slate-800 dark:text-slate-200">Học kỳ 2 (2025-2026)</strong></span>
                            </div>
                            <div className="flex items-center gap-4">
                                <button 
                                    onClick={() => setDarkMode(!darkMode)}
                                    className="p-2 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                                    title="Chuyển đổi giao diện"
                                >
                                    {darkMode ? <i data-lucide="sun" className="w-5 h-5 text-amber-400"></i> : <i data-lucide="moon" className="w-5 h-5"></i>}
                                </button>
                                <div className="flex items-center gap-3 pl-3 border-l border-slate-200 dark:border-slate-800">
                                    <div className="w-9 h-9 rounded-full bg-brand-500 text-white font-semibold flex items-center justify-center shadow-md">
                                        SV
                                    </div>
                                    <div className="hidden sm:block text-left">
                                        <div className="text-sm font-semibold leading-tight">Nguyễn Văn Sinh</div>
                                        <div className="text-xs text-slate-500 dark:text-slate-400">CNTT K66</div>
                                    </div>
                                </div>
                            </div>
                        </header>

                        {/* Dynamic Tab Content */}
                        <main className="flex-1 overflow-y-auto p-4 sm:p-8 bg-slate-50 dark:bg-slate-950">
                            {activeTab === 'dashboard' && <Dashboard courses={courses} tasks={tasks} schedule={schedule} grades={grades} studyHours={studyHours} setActiveTab={setActiveTab} />}
                            {activeTab === 'courses' && <CoursesTab courses={courses} setCourses={setCourses} schedule={schedule} setSchedule={setSchedule} showToast={showToast} />}
                            {activeTab === 'tasks' && <TasksTab tasks={tasks} setTasks={setTasks} courses={courses} showToast={showToast} />}
                            {activeTab === 'tools' && <ToolsTab notes={notes} setNotes={setNotes} studyHours={studyHours} setStudyHours={setStudyHours} showToast={showToast} />}
                            {activeTab === 'gpa' && <GpaTab grades={grades} setGrades={setGrades} showToast={showToast} />}
                        </main>
                    </div>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 text-sm font-medium animate-bounce">
                            <i data-lucide="check-circle" className="w-4 h-4 text-emerald-400"></i>
                            {toast}
                        </div>
                    )}
                </div>
            );
        }

        // --- SIDEBAR COMPONENT ---
        function Sidebar({ activeTab, setActiveTab, darkMode, setDarkMode }) {
            const navItems = [
                { id: 'dashboard', label: 'Tổng quan', icon: 'layout-dashboard' },
                { id: 'courses', label: 'Môn học & Lịch', icon: 'book-open' },
                { id: 'tasks', label: 'Bài tập & Nhiệm vụ', icon: 'check-square' },
                { id: 'tools', label: 'Công cụ học tập', icon: 'clock' },
                { id: 'gpa', label: 'Tính điểm GPA', icon: 'award' }
            ];

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [activeTab, darkMode]);

            return (
                <aside className="w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col shrink-0">
                    {/* Brand */}
                    <div className="h-16 px-6 border-b border-slate-200 dark:border-slate-800 flex items-center gap-3">
                        <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-blue-400 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                            <i data-lucide="graduation-cap" className="w-5 h-5"></i>
                        </div>
                        <div>
                            <h1 className="font-bold text-base leading-tight tracking-tight">StudyPlanner</h1>
                            <span className="text-xs text-slate-500 dark:text-slate-400">Student Edition</span>
                        </div>
                    </div>

                    {/* Navigation */}
                    <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto">
                        {navItems.map(item => {
                            const isActive = activeTab === item.id;
                            return (
                                <button
                                    key={item.id}
                                    onClick={() => setActiveTab(item.id)}
                                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${
                                        isActive 
                                            ? 'bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 shadow-sm' 
                                            : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-slate-200'
                                    }`}
                                >
                                    <i data-lucide={item.icon} className={`w-5 h-5 ${isActive ? 'text-brand-600 dark:text-brand-400' : 'text-slate-400'}`}></i>
                                    {item.label}
                                </button>
                            );
                        })}
                    </nav>

                    {/* Footer banner inside sidebar */}
                    <div className="p-4 border-t border-slate-200 dark:border-slate-800">
                        <div className="p-3 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700/50">
                            <div className="flex items-center gap-2 mb-1">
                                <i data-lucide="sparkles" className="w-4 h-4 text-amber-500"></i>
                                <span className="text-xs font-semibold">Mẹo học tập</span>
                            </div>
                            <p className="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
                                Hãy chia nhỏ bài tập lớn thành các mục tiêu nhỏ để hoàn thành dễ dàng hơn!
                            </p>
                        </div>
                    </div>
                </aside>
            );
        }

        // --- 1. DASHBOARD COMPONENT ---
        function Dashboard({ courses, tasks, schedule, grades, studyHours, setActiveTab }) {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, []);

            // Calculations
            const totalTasks = tasks.length;
            const completedTasks = tasks.filter(t => t.status === 'Done').length;
            const progressPercent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;

            // Calculate GPA (4.0 scale approximate from 10 scale)
            let totalCredits = 0;
            let sumPoints = 0;
            grades.forEach(g => {
                const p4 = g.score10 >= 8.5 ? 4.0 : g.score10 >= 7.0 ? 3.0 : g.score10 >= 5.5 ? 2.0 : g.score10 >= 4.0 ? 1.0 : 0.0;
                sumPoints += p4 * g.credits;
                totalCredits += g.credits;
            });
            const currentGPA = totalCredits > 0 ? (sumPoints / totalCredits).toFixed(2) : '0.00';

            // Upcoming deadlines (pending or in-progress tasks)
            const upcomingTasks = tasks.filter(t => t.status !== 'Done').sort((a,b) => new Date(a.dueDate) - new Date(b.dueDate));

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    {/* Welcome Banner */}
                    <div className="bg-gradient-to-r from-brand-600 to-blue-500 rounded-2xl p-6 sm:p-8 text-white shadow-xl shadow-brand-500/10 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold tracking-tight">Chào buổi sáng, Sinh viên! 👋</h2>
                            <p className="text-blue-100 mt-1 text-sm sm:text-base">Chúc bạn một ngày học tập hiệu quả. Bạn có {upcomingTasks.length} nhiệm vụ cần hoàn thành sắp tới.</p>
                        </div>
                        <button 
                            onClick={() => setActiveTab('tasks')}
                            className="bg-white text-brand-600 hover:bg-blue-50 font-semibold px-5 py-2.5 rounded-xl shadow-md transition text-sm flex items-center gap-2"
                        >
                            <i data-lucide="plus" className="w-4 h-4"></i> Thêm Nhiệm Vụ Mới
                        </button>
                    </div>

                    {/* Metrics Grid */}
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between">
                            <div>
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400">Tiến độ hoàn thành</span>
                                <h3 className="text-2xl font-bold mt-1 text-slate-900 dark:text-slate-100">{progressPercent}%</h3>
                                <span className="text-xs text-emerald-600 dark:text-emerald-400 font-medium mt-1 inline-block">
                                    {completedTasks}/{totalTasks} bài tập đã xong
                                </span>
                            </div>
                            <div className="w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 flex items-center justify-center">
                                <i data-lucide="pie-chart" className="w-6 h-6"></i>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between">
                            <div>
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400">Thời gian học tập</span>
                                <h3 className="text-2xl font-bold mt-1 text-slate-900 dark:text-slate-100">{studyHours}h</h3>
                                <span className="text-xs text-brand-600 dark:text-brand-400 font-medium mt-1 inline-block">Tuần này qua Pomodoro</span>
                            </div>
                            <div className="w-12 h-12 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-brand-600 dark:text-brand-400 flex items-center justify-center">
                                <i data-lucide="clock" className="w-6 h-6"></i>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between">
                            <div>
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400">Điểm GPA Tích lũy</span>
                                <h3 className="text-2xl font-bold mt-1 text-slate-900 dark:text-slate-100">{currentGPA} <span className="text-xs text-slate-400 font-normal">/ 4.0</span></h3>
                                <span className="text-xs text-amber-600 dark:text-amber-400 font-medium mt-1 inline-block">Xếp loại: Giỏi</span>
                            </div>
                            <div className="w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-950/50 text-amber-600 dark:text-amber-400 flex items-center justify-center">
                                <i data-lucide="award" className="w-6 h-6"></i>
                            </div>
                        </div>

                        <div className="bg-white dark:bg-slate-900 p-5 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-sm flex items-center justify-between">
                            <div>
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400">Môn học học kỳ</span>
                                <h3 className="text-2xl font-bold mt-1 text-slate-900 dark:text-slate-100">{courses.length}</h3>
                                <span className="text-xs text-indigo-600 dark:text-indigo-400 font-medium mt-1 inline-block">Đang theo học</span>
                            </div>
                            <div className="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
                                <i data-lucide="book-open" className="w-6 h-6"></i>
                            </div>
                        </div>
                    </div>

                    {/* Two Column Layout: Upcoming Deadlines & Weekly Analytics */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Upcoming Deadlines */}
                        <div className="lg:col-span-2 bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm">
                            <div className="flex items-center justify-between mb-4">
                                <h3 className="font-bold text-lg flex items-center gap-2">
                                    <i data-lucide="calendar-clock" className="w-5 h-5 text-brand-500"></i> Hạn nộp sắp tới (Deadlines)
                                </h3>
                                <button onClick={() => setActiveTab('tasks')} className="text-sm text-brand-600 dark:text-brand-400 hover:underline font-medium">Xem tất cả</button>
                            </div>
                            {upcomingTasks.length === 0 ? (
                                <div className="text-center py-10 text-slate-400">Tuyệt vời! Không có hạn nộp nào đang chờ.</div>
                            ) : (
                                <div className="space-y-3">
                                    {upcomingTasks.slice(0, 4).map(task => {
                                        const course = courses.find(c => c.id === task.courseId);
                                        const isUrgent = new Date(task.dueDate) - new Date() < 86400000 * 3;
                                        return (
                                            <div key={task.id} className="flex items-center justify-between p-4 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-100 dark:border-slate-800">
                                                <div className="flex items-start gap-3">
                                                    <div className={`w-2 h-10 rounded-full mt-0.5 ${task.priority === 'High' ? 'bg-rose-500' : task.priority === 'Medium' ? 'bg-amber-500' : 'bg-blue-500'}`}></div>
                                                    <div>
                                                        <h4 className="font-semibold text-sm">{task.title}</h4>
                                                        <span className="text-xs text-slate-500 dark:text-slate-400">{course ? course.name : 'Chung'}</span>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-medium ${isUrgent ? 'bg-rose-50 text-rose-600 dark:bg-rose-950/50 dark:text-rose-400' : 'bg-slate-200/60 dark:bg-slate-700 text-slate-700 dark:text-slate-300'}`}>
                                                        <i data-lucide="calendar" className="w-3.5 h-3.5"></i> {task.dueDate}
                                                    </span>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}
                        </div>

                        {/* Quick Course Overview */}
                        <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 p-6 shadow-sm flex flex-col">
                            <h3 className="font-bold text-lg mb-4 flex items-center gap-2">
                                <i data-lucide="layers" className="w-5 h-5 text-brand-500"></i> Môn học học kỳ
                            </h3>
                            <div className="space-y-3 flex-1 overflow-y-auto">
                                {courses.map(c => (
                                    <div key={c.id} className="p-3.5 rounded-xl border border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40 flex items-center justify-between">
                                        <div>
                                            <h4 className="font-semibold text-sm">{c.name}</h4>
                                            <span className="text-xs text-slate-500 dark:text-slate-400">{c.code} • {c.credits} tín chỉ</span>
                                        </div>
                                        <span className="text-xs font-medium px-2.5 py-1 rounded-md bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400">
                                            {c.room}
                                        </span>
                                    </div>
                                ))}
                            </div>
                            <button 
                                onClick={() => setActiveTab('courses')}
                                className="w-full mt-4 py-2.5 text-center text-sm font-medium text-brand-600 dark:text-brand-400 bg-brand-50 dark:bg-brand-950/50 hover:bg-brand-100 dark:hover:bg-brand-900/50 rounded-xl transition"
                            >
                                Quản lý Môn học & Lịch học
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 2. COURSES & SCHEDULE COMPONENT ---
        function CoursesTab({ courses, setCourses, schedule, setSchedule, showToast }) {
            const [showAddCourse, setShowAddCourse] = useState(false);
            const [showAddSchedule, setShowAddSchedule] = useState(false);
            
            // New course form state
            const [newCourse, setNewCourse] = useState({ name: '', code: '', credits: 3, instructor: '', room: '' });
            // New schedule form state

            const [timeLeft, setTimeLeft] = useState(25 * 60);
            const [isRunning, setIsRunning] = useState(false);
            const timerRef = useRef(null);

            // Web Audio API chime sound
            const playChime = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5 note
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start();
                    osc.stop(ctx.currentTime + 1.5);
                } catch (e) {
                    console.error(e);
                }
            };

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [mode, isRunning]);

            useEffect(() => {
                if (isRunning) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                setIsRunning(false);
                                playChime();
                                if (mode === 'work') {
                                    setStudyHours(h => Number((h + 0.42).toFixed(1))); // ~25 mins
                                    showToast('Hoàn thành phiên làm việc 25 phút! Hãy nghỉ ngơi nhé.');
                                } else {
                                    showToast('Đã hết giờ nghỉ! Sẵn sàng học tập tiếp.');
                                }
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else {
                    clearInterval(timerRef.current);
                }
                return () => clearInterval(timerRef.current);
            }, [isRunning, mode]);

            const switchMode = (newMode) => {
                setIsRunning(false);
                setMode(newMode);
                setTimeLeft(newMode === 'work' ? 25 * 60 : 5 * 60);
            };

            const resetTimer = () => {
                setIsRunning(false);
                setTimeLeft(mode === 'work' ? 25 * 60 : 5 * 60);
            };

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            };

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    <div>
                        <h2 className="text-2xl font-bold">Công cụ Hỗ trợ Học tập</h2>
                        <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Đồng hồ Pomodoro tập trung và Sổ tay ghi chú nhanh.</p>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        {/* Pomodoro Timer Card */}
                        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm flex flex-col items-center justify-center text-center">
                            <h3 className="font-bold text-lg mb-2 flex items-center gap-2">
                                <i data-lucide="timer" className="w-5 h-5 text-brand-500"></i> Pomodoro Focus Timer
                            </h3>
                            <p className="text-xs text-slate-500 dark:text-slate-400 mb-6">25 phút tập trung sâu / 5 phút nghỉ ngơi thư giãn</p>

                            <div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl mb-8">
                                <button 
                                    onClick={() => switchMode('work')}
                                    className={`px-5 py-2 rounded-lg text-xs font-semibold transition ${mode === 'work' ? 'bg-white dark:bg-slate-900 text-brand-600 shadow-sm' : 'text-slate-500'}`}
                                >
                                    Làm việc (25m)
                                </button>
                                <button 
                                    onClick={() => switchMode('break')}
                                    className={`px-5 py-2 rounded-lg text-xs font-semibold transition ${mode === 'break' ? 'bg-white dark:bg-slate-900 text-emerald-600 shadow-sm' : 'text-slate-500'}`}
                                >
                                    Nghỉ ngơi (5m)
                                </button>
                            </div>

                            {/* Circular countdown display */}
                            <div className="w-52 h-52 rounded-full border-8 border-brand-50 dark:border-slate-800 flex items-center justify-center shadow-inner relative mb-8 bg-gradient-to-tr from-brand-500/5 to-blue-500/10">
                                <div className="text-5xl font-extrabold tracking-tight font-mono text-slate-900 dark:text-slate-100">
                                    {formatTime(timeLeft)}
                                </div>
                            </div>

                            {/* Timer Controls */}
                            <div className="flex items-center gap-4">
                                <button 
                                    onClick={() => setIsRunning(!isRunning)}
                                    className={`px-6 py-3 rounded-xl font-semibold text-white shadow-lg transition flex items-center gap-2 ${
                                        isRunning ? 'bg-amber-500 hover:bg-amber-600 shadow-amber-500/20' : 'bg-brand-600 hover:bg-brand-700 shadow-brand-500/20'
                                    }`}
                                >
                                    <i data-lucide={isRunning ? 'pause' : 'play'} className="w-5 h-5"></i>
                                    {isRunning ? 'Tạm dừng' : 'Bắt đầu'}
                                </button>
                                <button 
                                    onClick={resetTimer}
                                    className="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition"
                                    title="Đặt lại"
                                >
                                    <i data-lucide="rotate-ccw" className="w-5 h-5"></i>
                                </button>
                            </div>
                        </div>

                        {/* Quick Notes Scratchpad */}
                        <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm flex flex-col">
                            <div className="flex justify-between items-center mb-4">
                                <h3 className="font-bold text-lg flex items-center gap-2">
                                    <i data-lucide="file-text" className="w-5 h-5 text-brand-500"></i> Ghi chú nhanh (Quick Notes)
                                </h3>
                                <span className="text-xs text-slate-400 font-medium">Tự động lưu</span>
                            </div>
                            <textarea 
                                value={notes} 
                                onChange={e => setNotes(e.target.value)}
                                placeholder="Ghi chú ý tưởng, danh sách việc cần làm nhanh tại đây..." 
                                className="w-full flex-1 p-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800/50 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 resize-none font-mono"
                                rows="10"
                            ></textarea>
                            <div className="mt-3 flex justify-end">
                                <button 
                                    onClick={() => showToast('Đã lưu ghi chú thành công!')}
                                    className="px-4 py-2 bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 hover:bg-brand-100 rounded-xl text-xs font-semibold transition"
                                >
                                    Lưu thủ công
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- 5. GPA CALCULATOR COMPONENT ---
        function GpaTab({ grades, setGrades, showToast }) {
            const [showAddGrade, setShowAddGrade] = useState(false);
            const [newGrade, setNewGrade] = useState({ courseName: '', credits: 3, score10: 8.0 });

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [grades, showAddGrade]);

            const handleAddGradeSubmit = (e) => {
                e.preventDefault();
                if (!newGrade.courseName) return;
                const created = { id: 'g_' + Date.now(), ...newGrade };
                setGrades([...grades, created]);
                setNewGrade({ courseName: '', credits: 3, score10: 8.0 });
                setShowAddGrade(false);
                showToast('Đã thêm môn học vào bảng điểm!');
            };

            const handleDeleteGrade = (id) => {
                setGrades(grades.filter(g => g.id !== id));
                showToast('Đã xóa điểm môn học.');
            };

            // Calculate GPA
            let totalCredits = 0;
            let sumPoints = 0;
            grades.forEach(g => {
                const p4 = g.score10 >= 8.5 ? 4.0 : g.score10 >= 7.0 ? 3.0 : g.score10 >= 5.5 ? 2.0 : g.score10 >= 4.0 ? 1.0 : 0.0;
                sumPoints += p4 * g.credits;
                totalCredits += g.credits;
            });
            const cumulativeGPA = totalCredits > 0 ? (sumPoints / totalCredits).toFixed(2) : '0.00';

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold">Tính điểm & Theo dõi GPA</h2>
                            <p className="text-sm text-slate-500 dark:text-slate-400 mt-1">Quản lý điểm số các môn học và tính GPA tích lũy theo thang điểm 4.0.</p>
                        </div>
                        <button 
                            onClick={() => setShowAddGrade(true)}
                            className="bg-brand-600 hover:bg-brand-700 text-white font-medium px-4 py-2.5 rounded-xl text-sm shadow-sm transition flex items-center gap-2"
                        >
                            <i data-lucide="plus" className="w-4 h-4"></i> Thêm Điểm Môn Học
                        </button>
                    </div>

                    {/* GPA Summary Box */}
                    <div className="bg-gradient-to-r from-emerald-600 to-teal-500 rounded-2xl p-6 text-white shadow-xl shadow-emerald-500/10 flex flex-col sm:flex-row justify-between items-center gap-6">
                        <div className="text-center sm:text-left">
                            <span className="text-emerald-100 text-sm font-medium">GPA Tích lũy dự kiến (Thang 4.0)</span>
                            <div className="text-4xl font-extrabold mt-1">{cumulativeGPA} <span className="text-lg font-normal text-emerald-100">/ 4.0</span></div>
                        </div>
                        <div className="flex gap-6 border-t sm:border-t-0 sm:border-l border-emerald-500/50 pt-4 sm:pt-0 sm:pl-6">
                            <div>
                                <span className="text-emerald-100 text-xs font-medium">Tổng số tín chỉ</span>
                                <div className="text-2xl font-bold mt-0.5">{totalCredits} TC</div>
                            </div>
                            <div>
                                <span className="text-emerald-100 text-xs font-medium">Số môn học</span>
                                <div className="text-2xl font-bold mt-0.5">{grades.length} môn</div>
                            </div>
                        </div>
                    </div>

                    {/* Grades Table */}
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden shadow-sm">
                        <div className="p-6 border-b border-slate-200 dark:border-slate-800 font-bold text-lg flex items-center gap-2">
                            <i data-lucide="award" className="w-5 h-5 text-brand-500"></i> Bảng chi tiết điểm số
                        </div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-50 dark:bg-slate-800/50 text-xs font-semibold text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
                                        <th className="p-4 pl-6">Môn học</th>
                                        <th className="p-4">Số tín chỉ</th>
                                        <th className="p-4">Điểm (Thang 10)</th>
                                        <th className="p-4">Điểm chữ & Quy đổi 4.0</th>
                                        <th className="p-4 pr-6 text-right">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800 text-sm">
                                    {grades.length === 0 ? (
                                        <tr>
                                            <td colSpan="5" className="text-center py-12 text-slate-400">Chưa có dữ liệu điểm. Hãy thêm môn học!</td>
                                        </tr>
                                    ) : (
                                        grades.map(g => {
                                            const s10 = g.score10;
                                            let letter = 'F', p4 = 0.0;
                                            if (s10 >= 8.5) { letter = 'A'; p4 = 4.0; }
                                            else if (s10 >= 7.8) { letter = 'B+'; p4 = 3.5; }
                                            else if (s10 >= 7.0) { letter = 'B'; p4 = 3.0; }
                                            else if (s10 >= 6.3) { letter = 'C+'; p4 = 2.5; }
                                            else if (s10 >= 5.5) { letter = 'C'; p4 = 2.0; }
                                            else if (s10 >= 4.8) { letter = 'D+'; p4 = 1.5; }
                                            else if (s10 >= 4.0) { letter = 'D'; p4 = 1.0; }

                                            return (
                                                <tr key={g.id} className="hover:bg-slate-50/50 dark:hover:bg-slate-800/30 transition">
                                                    <td className="p-4 pl-6 font-semibold">{g.courseName}</td>
                                                    <td className="p-4">{g.credits}</td>
                                                    <td className="p-4 font-mono font-bold text-brand-600 dark:text-brand-400">{s10}</td>
                                                    <td className="p-4">
                                                        <span className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 mr-2">
                                                            {letter}
                                                        </span>
                                                        <span className="text-xs text-slate-500 font-medium">({p4.toFixed(1)})</span>
                                                    </td>
                                                    <td className="p-4 pr-6 text-right">
                                                        <button onClick={() => handleDeleteGrade(g.id)} className="text-slate-400 hover:text-rose-500 transition">
                                                            <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* Add Grade Modal */}
                    {showAddGrade && (
                        <div className="fixed inset-0 z-50 bg-slate-950/50 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-800">
                                <h3 className="text-lg font-bold mb-4">Thêm Điểm Môn Học</h3>
                                <form onSubmit={handleAddGradeSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold mb-1 text-slate-500">Tên môn học</label>
                                        <input 
                                            type="text" required
                                            value={newGrade.courseName} onChange={e => setNewGrade({...newGrade, courseName: e.target.value})}
                                            placeholder="Ví dụ: An toàn thông tin" 
                                            className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                                        />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-semibold mb-1 text-slate-500">Số tín chỉ</label>
                                            <input 
                                                type="number" min="1" max="10" required
                                                value={newGrade.credits} onChange={e => setNewGrade({...newGrade, credits: Number(e.target.value)})}
                                                className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-semibold mb-1 text-slate-500">Điểm (Thang 10)</label>
                                            <input 
                                                type="number" step="0.1" min="0" max="10" required
                                                value={newGrade.score10} onChange={e => setNewGrade({...newGrade, score10: Number(e.target.value)})}
                                                className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-transparent text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                                            />
                                        </div>
                                    </div>
                                    <div className="flex justify-end gap-3 pt-2">
                                        <button type="button" onClick={() => setShowAddGrade(false)} className="px-4 py-2 text-sm rounded-xl font-medium text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">Hủy</button>
                                        <button type="submit" className="px-5 py-2 text-sm rounded-xl font-medium bg-brand-600 hover:bg-brand-700 text-white shadow-md transition">Lưu Điểm</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
